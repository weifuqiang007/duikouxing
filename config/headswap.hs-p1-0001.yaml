  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  rotation_smooth: 0.8
  translation_smooth: 0.8
  alpha_erode_px: 4
  alpha_feather_px: 18
  neck_cut_y_ratio: 1.35
  plate_expand_px: 10

color:
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
