profile: "cloud"

# Ubuntu 22.04 + RTX 4090 24GB 云服务器。所有路径相对项目根目录。
environments:
  orchestrator_prefix: "../.conda-envs/digital-human"
  dots_tts_prefix: "../.conda-envs/dots-tts"
  musetalk_prefix: "../.conda-envs/musetalk"
  latentsync_prefix: "../.conda-envs/latentsync"

executables:
  conda: "conda"
  ffmpeg: "ffmpeg"
  ffprobe: "ffprobe"

models:
  dots_quality: "../models/dots.tts-soar"
  dots_fast: "../models/dots.tts-mf"
  latentsync_1_6: "../external/LatentSync/checkpoints/latentsync_unet.pt"

paths:
  musetalk_repo: "../external/MuseTalk"
  latentsync_repo: "../external/LatentSync"
  jobs_root: "../jobs-cloud"

runtime:
  expected_gpu: "RTX 4090"
  gpu_id: 0
  musetalk_batch_size: 8
  use_float16: true
  tts_profile: "quality"
  primary_lipsync_engine: "latentsync_1_6"
