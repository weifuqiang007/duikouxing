# 第四轮 Round H1（§24.15）：恢复 A 原脖子几何。
# 基线 = v3-matte（不是 v3 final/collar 版）。只改：A neck 真实轮廓保护（class14，
# 非水平线）+ 禁用 B neck collar。jaw feather 保持 4px 隔离变量；jaw 调色 0。
job_id: "hs-p1-0004"
consent_confirmed: true   # 本人自测素材（new20260828/person1），本人知情同意

source_video: "C:/Users/魏富强/Desktop/视频/new20260828/person1/shipin.mp4"
source_portrait: "C:/Users/魏富强/Desktop/视频/new20260828/person1/zhenglian.png"
side_portraits:
  - "C:/Users/魏富强/Desktop/视频/new20260828/person1/celian.png"

liveportrait:            # 与 0003 完全一致（产物直接复用，不重跑）
  animation_region: "all"
  driving_multiplier: 1.0
  smooth_variance: 0.0000003
  source_max_dim: 1280
  source_crop_scale: 2.3
  source_crop_vx: 0.0
  source_crop_vy: -0.125
  driving_crop_scale: 2.2
  driving_crop_vx: 0.0
  driving_crop_vy: -0.1
  use_half_precision: true

plate:                   # v4 不使用整块底板
  sample_frames: 50
  min_samples: 8
  mask_expand_for_plate: 12
  inpaint_radius: 5

color:                   # 与 v3-matte 一致
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
  color_ema: 0.9

video:
  output_crf: 14
  keep_original_audio: true
  final_name: "final-v4-neck-preserve"       # output/final-v4-neck-preserve.mp4（§24.15）
  side_by_side_name: "side_by_side_v4_h1"

segmentation:            # 参数与 0003 相同，但必须重跑以生成 necks/
  roi_ratio: 2.6
  mask_dilate_px: 8
  mask_erode_px: 0
  temporal_ema: 0.0
  max_fail_ratio: 0.05
  output_neck_masks: true

composite:
  silent_name: "composite_silent-v4-neck-preserve"
  debug_dir_name: "debug-v4-neck-preserve"
  # —— 继承 v3-matte ——
  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  transform_mode: "eyes"
  filter_mode: "offline"
  hampel_window: 7
  filter_window: 11
  scale_mode: "const"
  angle_window: 21
  b_mask_erode_px: 1
  fill_mode: "wall_residual"
  ring_width_px: 30
  wall_delta_e: 10.0
  fill_outer_feather_px: 0
  mask_union: "motion_safe"
  safe_margin_px: 8
  neck_cut_y_ratio: 1.35      # 仅旧路径复现用（v4 主路径不读）
  # —— 第四轮核心（§24.10/24.11）——
  a_neck_preserve_enabled: true   # class14 真实轮廓保护 A 原脖子
  a_neck_upward_px: 3             # 只向上延展 3px（>6 须人工确认）
  neck_collar_enabled: false      # ★ B collar 已废弃（§24）
  neck_color_strength: 0.0
  # —— alpha：H1 统一 4px（隔离变量；H2 才把 jaw 提到 8）——
  alpha_mode: "region_aware"
  head_side_feather_px: 4
  jaw_feather_px: 4
  jaw_start_ratio: 0.68
  jaw_full_ratio: 0.82
  jaw_color_strength: 0.0         # H1/H2 为 0；H3 才 0.15~0.20
