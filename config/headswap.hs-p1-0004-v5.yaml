# 第五轮 I3（§26.14）：几何通过后的终选配置。
# 全局 color 参数保持不变（§26.16 禁止用 D1 全局压暗掩盖结构问题）；
# 只有几何闸门全过且仍剩肤色差时才比较 jaw_color_strength 0/0.12/0.18。
# 产物：output/final.mp4（最终候选，几何通过后才允许写）。
job_id: "hs-p1-0004"
consent_confirmed: true   # 本人自测素材（new20260828/person1），本人知情同意

source_video: "C:/Users/魏富强/Desktop/视频/new20260828/person1/shipin.mp4"
source_portrait: "C:/Users/魏富强/Desktop/视频/new20260828/person1/zhenglian.png"
side_portraits:
  - "C:/Users/魏富强/Desktop/视频/new20260828/person1/celian.png"

liveportrait:            # 复用（不重跑）
  animation_region: "all"
  driving_multiplier: 1.0
  smooth_variance: 0.0000003
  source_max_dim: 1280
  source_crop_scale: 2.3
  source_crop_vx: 0.0
  source_crop_vy: -0.125
  driving_crop_scale: 2.2
  driving_crop_vx: 0.0
  driving_crop_vy: -0.1
  use_half_precision: true

plate:
  sample_frames: 50
  min_samples: 8
  mask_expand_for_plate: 12
  inpaint_radius: 5

color:
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
  color_ema: 0.9

video:
  output_crf: 14
  keep_original_audio: true
  final_name: "final"             # §26.14：最终候选才写 final.mp4
  side_by_side_name: "side_by_side_v5"

segmentation:
  roi_ratio: 2.6
  mask_dilate_px: 8
  mask_erode_px: 0
  temporal_ema: 0.0
  max_fail_ratio: 0.05
  output_neck_masks: true

composite:
  silent_name: "composite_silent-v5"
  debug_dir_name: "debug-v5"
  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  transform_mode: "eyes"
  filter_mode: "offline"
  hampel_window: 7
  filter_window: 11
  scale_mode: "const"
  angle_window: 21
  b_mask_erode_px: 1
  fill_mode: "wall_residual"
  ring_width_px: 30
  wall_delta_e: 10.0
  fill_outer_feather_px: 0
  mask_union: "motion_safe"
  safe_margin_px: 8
  a_neck_preserve_enabled: true
  a_neck_upward_px: 3
  neck_collar_enabled: false
  neck_color_strength: 0.0
  alpha_mode: "region_aware"
  head_side_feather_px: 4
  jaw_feather_px: 8
  jaw_start_ratio: 0.68
  jaw_full_ratio: 0.82
  jaw_color_strength: 0.0         # I3 先保持 0；几何通过且仍有肤色差才试 0.12/0.18
  jaw_underlay_enabled: true
  jaw_underlay_px: 10             # 以 I1/I2 probe 定档结果为准
  neck_taper_height_px: 16
  neck_taper_side_px: 2
