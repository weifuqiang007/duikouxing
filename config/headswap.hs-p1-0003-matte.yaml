# 第三轮 Round F（§22.6）：Round E 基础上只改 B 头白边——硬 mask 内缩 1px + 羽化 6→4px。
# 不接 neck collar；补洞/运动/色彩/音频与 Round E 完全一致。
# 实跑命令行备份：jobs-home/hs-p1-0003/logs/composite_v3_matte.log
job_id: "hs-p1-0003"
consent_confirmed: true   # 本人自测素材（new20260828/person1），本人知情同意

source_video: "C:/Users/魏富强/Desktop/视频/new20260828/person1/shipin.mp4"
source_portrait: "C:/Users/魏富强/Desktop/视频/new20260828/person1/zhenglian.png"
side_portraits:
  - "C:/Users/魏富强/Desktop/视频/new20260828/person1/celian.png"

liveportrait:            # 与 0002 完全一致（产物直接复用，不重跑）
  animation_region: "all"
  driving_multiplier: 1.0
  smooth_variance: 0.0000003
  source_max_dim: 1280
  source_crop_scale: 2.3
  source_crop_vx: 0.0
  source_crop_vy: -0.125
  driving_crop_scale: 2.2
  driving_crop_vx: 0.0
  driving_crop_vy: -0.1
  use_half_precision: true

plate:                   # v3 不使用整块底板，字段仅为 plate 对照模式保留
  sample_frames: 50
  min_samples: 8
  mask_expand_for_plate: 12
  inpaint_radius: 5

color:                   # 与 Round E 一致
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
  color_ema: 0.9

video:
  output_crf: 14
  keep_original_audio: true
  final_name: "final-v3-matte"           # output/final-v3-matte.mp4（§22.8）
  side_by_side_name: "side_by_side_v3_matte"

segmentation:            # 与 0002 终版一致（EMA=0），masks 复用不重跑
  roi_ratio: 2.6
  mask_dilate_px: 8
  mask_erode_px: 0
  temporal_ema: 0.0
  max_fail_ratio: 0.05

composite:
  silent_name: "composite_silent-v3-matte"
  debug_dir_name: "debug-v3-matte"
  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  transform_mode: "eyes"
  filter_mode: "offline"
  hampel_window: 7
  filter_window: 11
  scale_mode: "const"
  angle_window: 21
  alpha_mode: "inner"
  alpha_feather_px: 4          # ★ Round F：6→4（§22.6）
  b_mask_erode_px: 1           # ★ Round F：B 硬 matte 内缩 1px 去白边（§20.5.2）
  neck_collar_enabled: false   # Round F 不接 neck
  fill_mode: "wall_residual"
  ring_width_px: 30
  wall_delta_e: 10.0
  fill_outer_feather_px: 0
  neck_keep_ratio: 0.05
  mask_union: "motion_safe"
  safe_margin_px: 8
  neck_cut_y_ratio: 1.35
