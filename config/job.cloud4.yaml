# 交付推荐参数 —— 源自 2026-08-19 云端 A/B/C 口型幅度实验（wlh-004，对比可灵基准）：
#   c3 基线 guidance 1.3：嘴基本不张，客户投诉"嘴没张开、僵硬"
#   c4 (A) guidance 1.5：小幅改善
#   c5 (B) guidance 1.8：明显改善，纯官方参数、零补丁依赖（保守备选）
#   c6 (C) guidance 1.5 + audio_amp 1.3：开口幅度最接近可灵，本配置采用
# 换客户/任务时改 job_id 与素材字段；若某客户出现嘴部过冲/闪烁，先把
# audio_amp 降回 1.0（即 c4 参数），再不行整体换 c5 参数（guidance 1.8 + 去掉 audio_amp）。
job_id: "wlh-004-c6-delivery"
consent_confirmed: true
local_only: false  # cloud profile 在自建云服务器处理

source_video: "../samples/wlh_1080close.mp4"

# 留空 = 从 source_video 自动截取参考音频（0~14 秒）。
reference_audio: ""
reference_start_seconds: 0.0
reference_duration_seconds: 14.0

# 必须与截取片段（0~14 秒）实际内容逐字一致。
reference_text: "我是魏龙虎，身份证1 5 2 6 3 0 1 9 9 2 1 0 1 8 7 2 1 0，现就职于河北省成广建设有限公司，特此证明。"
script: "我是魏龙虎，身份证1 5 2 6 3 0 1 9 9 2 1 0 1 8 7 2 1 0，于2026年8月19日入职河北蓝念建筑工程有限公司。视频拍摄时间2026年9月7日。本人承诺：此视频真实有效，对视频的真实性负责，如有虚假承诺或挂靠出借证件行为，本人愿意承担一切法律责任。"

tts:
  profile: "auto"          # auto：cloud 机器配置解析为 quality（SOAR）
  language: "ZH"
  max_chars_per_segment: 60
  guidance_scale: 1.2
  seed: 42

video:
  fps: 25
  duration_policy: "pingpong"
  final_crf: 12

lipsync:
  engine: "latentsync_1_6"
  inference_steps: 30
  guidance_scale: 1.5     # 官方训练值；配合下行 audio_amp 使用
  audio_amp: 1.3          # whisper 音频特征放大（补丁旋钮，1.0 = 官方原行为）
  seed: 1247
  enable_deepcache: false

composite:
  mode: "native"
  texture_strength: 0.0
  detail_sigma: 1.2
  mask_feather_pixels: 6
  temporal_ema: 0.80
  optical_flow: true
  detect_interval: 5
  change_threshold: 2.5

mouth_roi:
  center_x: 0.50
  center_y: 0.40
  width: 0.16
  height: 0.11
  feather_pixels: 18
