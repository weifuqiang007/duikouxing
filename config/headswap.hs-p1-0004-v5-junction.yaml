side_portraits:
  - "C:/Users/魏富强/Desktop/视频/new20260828/person1/celian.png"

liveportrait:            # 复用（不重跑）
  animation_region: "all"
  driving_multiplier: 1.0
  smooth_variance: 0.0000003
  source_max_dim: 1280
  source_crop_scale: 2.3
  source_crop_vx: 0.0
  source_crop_vy: -0.125
  driving_crop_scale: 2.2
  driving_crop_vx: 0.0
  driving_crop_vy: -0.1
  use_half_precision: true

plate:
  sample_frames: 50
  min_samples: 8
  mask_expand_for_plate: 12
  inpaint_radius: 5

color:                   # 几何未通过前不动全局色彩
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
  color_ema: 0.9

video:
  output_crf: 14
  keep_original_audio: true
  final_name: "final-v5-junction"
  side_by_side_name: "side_by_side_v5_junction"

segmentation:
  roi_ratio: 2.6
  mask_dilate_px: 8
  mask_erode_px: 0
  temporal_ema: 0.0
  max_fail_ratio: 0.05
  output_neck_masks: true

composite:
  silent_name: "composite_silent-v5-junction"
  debug_dir_name: "debug-v5-junction"
  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  transform_mode: "eyes"
  filter_mode: "offline"
  hampel_window: 7
  filter_window: 11
  scale_mode: "const"
  angle_window: 21
  b_mask_erode_px: 1
  fill_mode: "wall_residual"
  ring_width_px: 30
  wall_delta_e: 10.0
  fill_outer_feather_px: 0
  mask_union: "motion_safe"
  safe_margin_px: 8
  a_neck_preserve_enabled: true
  a_neck_upward_px: 3
  neck_collar_enabled: false
  neck_color_strength: 0.0
  alpha_mode: "region_aware"
  head_side_feather_px: 4
  jaw_feather_px: 8
  jaw_start_ratio: 0.68
  jaw_full_ratio: 0.82
  jaw_color_strength: 0.0         # I2 仍为 0
  # —— 第五轮核心：I1 定档 underlay + taper ——
  jaw_underlay_enabled: true
  jaw_underlay_px: 10             # 以 I1 probe 结果为准（8/10/12）
  neck_taper_height_px: 16        # 12/16/20 probe 后定档
  neck_taper_side_px: 2
