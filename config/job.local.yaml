# 任务配置 —— 本文件名已被 .gitignore 排除，客户素材信息不会进入 git。
# 每换一个客户/任务就更新本文件内容（job_id 必须同时换新，重复的 job_id 修改后需要 --force）。

job_id: "wlh-001"
consent_confirmed: true        # 运行前必须改为 true：确认已获得人物的肖像与声音授权
local_only: true

# 相对路径基于本文件所在目录（config/）解析；客户视频放 samples/ 目录。
source_video: "../samples/wlh.mp4"

# 留空 = 从 source_video 自动截取参考音频（推荐做法，无需单独录制）。
reference_audio: ""
reference_start_seconds: 0.0    # 客户念参考话术的起始秒（注意：起点）
reference_duration_seconds: 14.0 # 往后截取的时长（注意：是时长，不是结束时间点）

# 必填：与截取片段（start ~ start+duration）里实际说出的话逐字一致，是声音克隆的提示文本。
reference_text: "我是魏龙虎，身份证1 5 2 6 3 0 1 9 9 2 1 0 1 8 7 2 1 0，现就职于河北省成广建设有限公司，特此证明。"

# 必填：希望人物说出的新话术。
script: "我是魏龙虎，身份证1 5 2 6 3 0 1 9 9 2 1 0 1 8 7 2 1 0，于2026年8月19日入职河北蓝念建筑工程有限公司。视频拍摄时间2026年9月7日。本人承诺：此视频真实有效，对视频的真实性负责，如有虚假承诺或挂靠出借证件行为，本人愿意承担一切法律责任。"

tts:
  profile: "auto"          # auto 使用 office/home 机器配置；也可强制 quality 或 fast
  language: "ZH"
  max_chars_per_segment: 60
  guidance_scale: 1.2
  seed: 42

video:
  fps: 25
  duration_policy: "pingpong"  # cut 或 pingpong（新话术比源视频长时循环补足）

lipsync:
  parsing_mode: "jaw"
  extra_margin: 10
  left_cheek_width: 90
  right_cheek_width: 90

# 归一化坐标，范围 0~1。不同客户构图不同，改完后先跑 preview-roi 人工确认再 run。
# 用 annotate-roi 命令拖拽标定后自动写回；下面是占位值，跑任务前必须先标注。
mouth_roi:
  center_x: 0.5181
  center_y: 0.2992
  width: 0.275
  height: 0.0969
  feather_pixels: 18
