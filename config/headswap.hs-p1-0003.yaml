# 第三轮 Round G 终版（§22.7/§22.8）：Round F 基础上接 neck collar——
# B 脖子窄条（下颌 + 0.12×脸高窗口，warp 后 A 画布 14px 纵向 ramp）+ 0.25 弱局部调色。
# 注：正式流程先出 nocolor 版（把 neck_color_strength 改 0 重跑 composite+finalize，
# 产物改名 final-v3-neck-nocolor.mp4），几何过闸后再用本配置出终版。
# 实跑命令行备份：logs/composite_v3_final.log（加色）/ logs/composite_v3_neck.log（nocolor）
job_id: "hs-p1-0003"
consent_confirmed: true   # 本人自测素材（new20260828/person1），本人知情同意

source_video: "C:/Users/魏富强/Desktop/视频/new20260828/person1/shipin.mp4"
source_portrait: "C:/Users/魏富强/Desktop/视频/new20260828/person1/zhenglian.png"
side_portraits:
  - "C:/Users/魏富强/Desktop/视频/new20260828/person1/celian.png"

liveportrait:            # 与 0002 完全一致（产物直接复用，不重跑）
  animation_region: "all"
  driving_multiplier: 1.0
  smooth_variance: 0.0000003
  source_max_dim: 1280
  source_crop_scale: 2.3
  source_crop_vx: 0.0
  source_crop_vy: -0.125
  driving_crop_scale: 2.2
  driving_crop_vx: 0.0
  driving_crop_vy: -0.1
  use_half_precision: true

plate:                   # v3 不使用整块底板，字段仅为 plate 对照模式保留
  sample_frames: 50
  min_samples: 8
  mask_expand_for_plate: 12
  inpaint_radius: 5

color:
  color_strength: 0.55
  max_delta_l: 20
  max_delta_ab: 12
  color_ema: 0.9

video:
  output_crf: 14
  keep_original_audio: true
  final_name: "final"                    # ★ 终版 output/final.mp4
  side_by_side_name: "side_by_side_v3"   # previews/side_by_side_v3.mp4

segmentation:            # 与 0002 终版一致（EMA=0），masks 复用不重跑
  roi_ratio: 2.6
  mask_dilate_px: 8
  mask_erode_px: 0
  temporal_ema: 0.0
  max_fail_ratio: 0.05

composite:
  silent_name: "composite_silent-v3"
  debug_dir_name: "debug-v3-neck-color"
  scale_bias: 1.0
  x_offset_px: 0
  y_offset_px: 0
  transform_mode: "eyes"
  filter_mode: "offline"
  hampel_window: 7
  filter_window: 11
  scale_mode: "const"
  angle_window: 21
  alpha_mode: "inner"
  alpha_feather_px: 4
  b_mask_erode_px: 1
  neck_collar_enabled: true     # ★ Round G
  neck_collar_ratio: 0.12       # collar 高 = 0.12×A 脸高（0.10~0.14）
  neck_collar_soft_px: 14       # 下颌→A 脖子纵向过渡 10~18px
  neck_color_strength: 0.25     # collar 弱局部调色（nocolor 版先改 0）
  fill_mode: "wall_residual"
  ring_width_px: 30
  wall_delta_e: 10.0
  fill_outer_feather_px: 0
  # neck_keep_ratio 不生效：collar 启用时保护线自动 = collar_bottom（§22.7.4）
  mask_union: "motion_safe"
  safe_margin_px: 8
  neck_cut_y_ratio: 1.35        # collar 启用时被 collar 纵向 ramp 取代（仅回退模式用）
