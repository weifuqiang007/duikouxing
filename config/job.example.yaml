job_id: "demo-001"
consent_confirmed: false
local_only: true

# 相对路径基于 config/ 目录解析。
source_video: "../samples/source.mp4"

# 推荐单独准备 10～20 秒干净参考音频；如果留空，则从 source_video 截取。
reference_audio: "../samples/reference.wav"
reference_start_seconds: 0.0
reference_duration_seconds: 15.0

# 必须与参考音频实际内容逐字一致。
reference_text: "这里填写参考音频实际说出的文字。"
script: "这里填写希望人物说出的新话术。"

tts:
  profile: "auto"          # auto 使用 office/home 配置；也可强制 quality 或 fast
  language: "ZH"
  max_chars_per_segment: 60
  guidance_scale: 1.2
  seed: 42

video:
  fps: 25
  duration_policy: "pingpong"  # cut 或 pingpong

lipsync:
  # batch_size 和 use_float16 默认由 office/home 机器配置决定。
  parsing_mode: "jaw"
  extra_margin: 10
  left_cheek_width: 90
  right_cheek_width: 90

# 默认使用 MuseTalk 的完整下半脸动作，只从原视频回填毛孔/痘坑等高频细节。
# fixed_roi 仅用于回归对比，会在人物原本开口说话时产生贴片感。
composite:
  mode: "dynamic_texture"       # dynamic_texture 或 fixed_roi
  texture_strength: 0.55        # 高频纹理回填强度，建议 0.45～0.65
  detail_sigma: 1.2             # 高低频分离尺度
  mask_feather_pixels: 6
  temporal_ema: 0.80            # 人脸框时序平滑，越大越稳定
  optical_flow: true            # 将原片纹理对齐到 MuseTalk 局部形变
  detect_interval: 5
  change_threshold: 2.5

# 归一化坐标，范围 0～1。dynamic_texture 中仅作为人脸检测失败时的安全定位；
# fixed_roi 中才作为实际像素混合蒙版。仍建议先运行 preview-roi 人工确认。
mouth_roi:
  center_x: 0.50
  center_y: 0.40
  width: 0.16
  height: 0.11
  feather_pixels: 18
