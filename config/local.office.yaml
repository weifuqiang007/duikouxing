profile: "office"

# 路径均相对本文件所在 config/ 目录解析，随仓库位置自动适配。
environments:
  orchestrator_prefix: "../.conda-envs/digital-human"
  dots_tts_prefix: "../.conda-envs/dots-tts"
  musetalk_prefix: "../.conda-envs/musetalk"

executables:
  conda: "conda"
  ffmpeg: "ffmpeg"
  ffprobe: "ffprobe"

models:
  dots_quality: "../models/dots.tts-soar"
  dots_fast: "../models/dots.tts-mf"

paths:
  musetalk_repo: "../external/MuseTalk"
  jobs_root: "../jobs-office"

runtime:
  expected_gpu: "RTX 3060"
  gpu_id: 0
  musetalk_batch_size: 2
  use_float16: true
  tts_profile: "quality"
