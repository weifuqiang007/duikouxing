[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-digital-human"
version = "0.1.0"
description = "Local voice cloning and lip-sync orchestration for privacy-sensitive videos"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.15.12",
]

[project.scripts]
digital-human = "digital_human.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

